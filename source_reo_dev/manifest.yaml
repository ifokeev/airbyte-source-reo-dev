version: 7.17.1

type: DeclarativeSource

check:
  type: CheckStream
  stream_names:
    - segments

definitions:
  linked:
    HttpRequester:
      authenticator:
        type: ApiKeyAuthenticator
        api_token: "{{ config['api_key'] }}"
        inject_into:
          type: RequestOption
          field_name: x-api-key
          inject_into: header
      error_handler:
        type: DefaultErrorHandler
        max_retries: 8
        response_filters:
          - type: HttpResponseFilter
            action: RETRY
            http_codes:
              - 429
        backoff_strategies:
          - type: ExponentialBackoffStrategy
            factor: 5
    SimpleRetriever:
      paginator:
        type: DefaultPaginator
        page_token_option:
          type: RequestOption
          field_name: page
          inject_into: request_parameter
        pagination_strategy:
          type: PageIncrement
          page_size: 100
          start_from_page: 1
        pagination_strategy_options:
          stop_condition: "{{ response.get('page_no', 0) >= response.get('total_pages', 0) }}"

streams:
  - type: DeclarativeStream
    name: segments
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        url: https://integration.reo.dev/segments
        http_method: GET
        authenticator:
          $ref: "#/definitions/linked/HttpRequester/authenticator"
        error_handler:
          $ref: "#/definitions/linked/HttpRequester/error_handler"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - data
    primary_key:
      - id
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        $schema: http://json-schema.org/schema#
        required:
          - id
        properties:
          type:
            type:
              - string
              - "null"
          id:
            type: string
          name:
            type:
              - string
              - "null"
          owner:
            type:
              - string
              - "null"
        additionalProperties: true
  - type: DeclarativeStream
